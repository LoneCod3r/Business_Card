    --text-3:#727C92;
    --blue:#4C86FA;
    --font-mono:'JetBrains Mono', 'Consolas', monospace;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);

    align-items:center;
    justify-content:center;
    padding:64px 24px;

    transform:rotateY(180deg);
  }

    .card{transition:none;}

  .qr-panel{

  .qr-panel > div{

  .qr-panel img,

</head>
